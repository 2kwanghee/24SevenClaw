name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 변경 감지 ──
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'clickeye-web/**'
            api:
              - 'clickeye-api/**'
            contracts:
              - 'clickeye-contracts/**'
            scripts:
              - 'scripts/**'
              # 워크플로 자체도 이 잡의 대상이다 — 셸 주입 검사가 여기 있으므로
              # 워크플로만 바꾼 PR 이 검사를 건너뛰면 안 된다(CE-375).
              - '.github/workflows/**'
              - 'CLAUDE.md'
              - 'PjPlan.md'
              - 'docs/**'

  # ── Web: lint + typecheck + build ──
  web:
    name: Web (lint / typecheck / build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clickeye-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clickeye-web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-test-secret

  # ── API: lint + typecheck ──
  api:
    name: API (lint / typecheck)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clickeye-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy app/ --ignore-missing-imports

  # ── API Integration: 실 Postgres 마이그레이션 스모크 ──
  # 단위 잡(api)은 SQLite in-memory + create_all 로 회귀 0 유지. 이 잡은 실
  # Postgres 서비스 컨테이너에 alembic upgrade head 를 적용해 마이그레이션 체인과
  # PG 전용 기능을 검증한다(pytest -m pg). 기존 단위 경로와 완전 분리.
  api-integration:
    name: API Integration (Postgres migrations)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clickeye-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clickeye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # env.py 는 settings.database_url(=DATABASE_URL) 사용 → alembic 대상 DB
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clickeye_test
      # conftest pg fixture/skip 판정 + 마이그레이션 테스트 대상 DB
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clickeye_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Alembic upgrade head (실 Postgres)
        run: uv run alembic upgrade head

      - name: Run Postgres integration tests
        run: uv run pytest -m pg -q

  # ── OpenAPI Contract 파이프라인 ──
  openapi-sync:
    name: OpenAPI Sync (export → generate → validate)
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install API dependencies
        working-directory: clickeye-api
        run: uv sync

      - name: Export OpenAPI spec
        working-directory: clickeye-api
        run: uv run python -m scripts.export_openapi

      - name: Install contracts dependencies
        working-directory: clickeye-contracts
        run: npm install

      - name: Generate TypeScript client
        working-directory: clickeye-contracts
        run: npx @hey-api/openapi-ts -i openapi/openapi.json -o generated/typescript -c @hey-api/client-fetch

      - name: TypeScript type check
        working-directory: clickeye-contracts
        run: npx tsc --noEmit

  # ── Scripts: 기존 검증 ──
  scripts:
    name: Scripts Validation
    needs: changes
    # fail-closed. 이 잡에 워크플로 셸 주입 검사(CE-375)가 들어 있어서, `changes` 가
    # 실패해 출력이 비면 잡이 통째로 스킵되고 **스킵은 CI 에서 초록색**이다 — 즉
    # `changes` 를 죽이는 것만으로 보안 검사를 우회할 수 있었다(CE-376).
    # 필터를 믿을 수 없으면 믿지 말고 실행한다. 취소 시에는 돌지 않는다.
    if: |
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 워크플로 셸 주입 차단 — run 블록에서 신뢰불가 입력을 `${{ }}` 로 치환하면 그 값이
      # 셸 소스가 되어 임의 명령이 실행된다(CE-375, 실측 PR #106). 되돌아오면 여기서 막는다.
      - name: Check workflow shell injection
        run: |
          pip install --quiet pyyaml
          python3 scripts/check_workflow_injection.py
          # 검사기 자신의 테스트 — 첫 구현이 주입 7건 중 1건만 잡은 채 통과한 직접 원인이
          # 테스트 부재였다. 가드가 잡지 못하면 없는 것보다 나쁘다(거짓 안심).
          python3 scripts/tests/test_check_workflow_injection.py

      - name: Check shell scripts syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "✅ $f" || echo "❌ $f"
          done

      - name: Check Python scripts syntax
        run: |
          for f in scripts/*.py; do
            python3 -m py_compile "$f" && echo "✅ $f" || echo "❌ $f"
          done

      - name: Validate docs exist
        run: |
          test -f CLAUDE.md && echo "✅ CLAUDE.md"
          test -f PjPlan.md && echo "✅ PjPlan.md"
          test -d docs && echo "✅ docs/"

      - name: Governance gate unit tests
        run: |
          pip install pytest
          python3 -m pytest scripts/tests/test_pre_merge_gate.py -q

  # ── 거버넌스 게이트 (PR 미러 — 권위 게이트는 auto_dev_pipeline.sh 의 머지 직전 호출) ──
  # 동일 SSOT(scripts/pre_merge_gate.py)를 PR에서 재확인. contract-drift + ticket-ref 검증,
  # plan-trace 는 .ralph 산출물 부재로 자동 skip. 필수 체크로 지정 시에만 PR 차단(현재 비차단).
  governance:
    name: Governance Gate (mirror)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-merge governance gate
        # 브랜치명은 신뢰할 수 없는 입력이다 — git 레퍼런스가 백틱·$·괄호를 허용하므로
        # run 안에서 `${{ }}` 로 치환하면 브랜치명만으로 명령 치환이 성립한다(CE-375).
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD 2>/dev/null || echo "")
          python3 scripts/pre_merge_gate.py \
            --head "$HEAD_REF" \
            --diff-files "$FILES" \
            --ci --json
