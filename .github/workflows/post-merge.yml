name: Post-Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  post-merge:
    name: Post-Merge Cleanup
    runs-on: ubuntu-latest
    # 머지된 PR만 (닫힌 것 제외)
    if: github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract Linear issue ID
        id: linear
        # PR 본문은 신뢰할 수 없는 입력이다. `${{ }}` 는 bash 가 파싱하기 전에 스크립트
        # 텍스트로 치환되므로 run 안에서 쓰면 본문이 곧 셸 소스가 된다(큰따옴표로 감싸도
        # 백틱·$(...)·" 가 그대로 동작). 실측 2026-08-05 PR #106: 본문의 백틱 코드 스팬이
        # 실행돼 `npm test`·`npx next build` 가 CI 에서 돌고 스텝이 죽었다(CE-375).
        # env: 로 넘긴 값은 스크립트에 스플라이스되지 않고 환경변수로 주입된다 — 셸이 파싱하지 않는다.
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 추출은 scripts/extract_issue_key.py 가 한다 — 브랜치명 1순위, 본문은 폴백.
          # 전 구현은 본문만 grep 해서 정규식 리터럴에 속았다(실측 PR #108: `Z0-9` 를
          # 키로 집어 Linear 자동 Done 이 조용히 멈췄다). 브랜치는 규약이 강제되고
          # 거버넌스 ticket-ref 가 이미 그 근거로 머지를 차단하므로 판정이 일치한다(CE-376).
          ISSUE_ID=$(python3 scripts/extract_issue_key.py)
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Extracted Linear issue: ${ISSUE_ID:-(없음)}"

      - name: Update Linear issue to Done
        if: steps.linear.outputs.issue_id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          ISSUE_ID: ${{ steps.linear.outputs.issue_id }}
        run: |
          # Linear 이슈를 Done 상태로 업데이트
          python3 -c "
          import os, sys
          sys.path.insert(0, 'scripts')
          from linear_client import get_env, find_state_id, linear_request

          api_key = os.environ['LINEAR_API_KEY']
          team_id = os.environ['LINEAR_TEAM_ID']

          # identifier로 이슈 ID 조회. 치환 대신 환경변수로 읽는다 — 값이 grep 으로
          # [A-Z0-9]+-\d+ 에 한정돼 위험은 낮지만 같은 원칙을 예외 없이 적용한다(CE-375).
          identifier = os.environ['ISSUE_ID']
          query = '''
          query(\$filter: IssueFilter!) {
              issues(filter: \$filter, first: 1) {
                  nodes { id identifier state { name } }
              }
          }
          '''
          data = linear_request(api_key, query, {
              'filter': {'identifier': {'eq': identifier}}
          })
          if not data or not data.get('issues', {}).get('nodes'):
              print(f'Linear issue {identifier} not found')
              sys.exit(0)

          issue = data['issues']['nodes'][0]
          issue_id = issue['id']
          current_state = issue.get('state', {}).get('name', '')

          if current_state == 'Done':
              print(f'{identifier} already Done')
              sys.exit(0)

          # Done 상태로 변경
          state_id = find_state_id(api_key, team_id, 'Done')
          if not state_id:
              print('Done state not found')
              sys.exit(1)

          mutation = '''
          mutation(\$issueId: String!, \$stateId: String!) {
              issueUpdate(id: \$issueId, input: { stateId: \$stateId }) {
                  issue { id identifier state { name } }
              }
          }
          '''
          result = linear_request(api_key, mutation, {
              'issueId': issue_id,
              'stateId': state_id,
          })
          if result:
              print(f'UPDATED: {identifier} → Done')
          "

      - name: Send Telegram notification
        if: steps.linear.outputs.issue_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # PR 제목과 브랜치명도 신뢰할 수 없는 입력이다 — git 레퍼런스는 백틱·$·괄호를
          # 허용하므로 브랜치명만으로도 명령 치환이 성립한다(CE-375).
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_ID: ${{ steps.linear.outputs.issue_id }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 scripts/telegram_notify.py \
            --message "✅ *머지 완료*
          PR: ${PR_TITLE}
          이슈: ${ISSUE_ID}
          브랜치: ${HEAD_REF} → main" \
            2>/dev/null || true
